name: CMake

on:
  push:
  pull_request:

jobs:
  build-pumgen:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-release
            cc: gcc
            cxx: g++
            build_type: Release
          - name: gcc-debug-sanitizers
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: address,undefined
          - name: clang-debug-sanitizers
            cc: clang
            cxx: clang++
            build_type: Debug
            sanitizers: address,undefined
          # the velocity-aware sizing and its tests
          - name: gcc-release-easi
            cc: gcc
            cxx: g++
            build_type: Release
            easi: true

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq ninja-build clang libomp-dev openmpi-bin libopenmpi-dev \
            hdf5-tools libhdf5-openmpi-dev libyaml-cpp-dev

      - name: Install easi
        if: matrix.easi
        run: |
          git clone --filter=blob:none https://github.com/SeisSol/easi.git ${{ runner.temp }}/easi
          git -C ${{ runner.temp }}/easi checkout f668a64afa61191d8c9ae4e6adf47aecd2529e00
          cmake -S ${{ runner.temp }}/easi -B ${{ runner.temp }}/easi/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ runner.temp }}/opt \
            -DASAGI=OFF -DLUA=OFF -DIMPALAJIT=OFF -DTESTING=OFF
          cmake --build ${{ runner.temp }}/easi/build
          cmake --install ${{ runner.temp }}/easi/build

      - name: Configure PUMGen
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DSANITIZERS=${{ matrix.sanitizers }}
          -DCMAKE_CXX_FLAGS=${{ matrix.sanitizers && '-fno-sanitize-recover=undefined' || '' }}
          -DEASI=${{ matrix.easi && 'ON' || 'OFF' }}
          -DCMAKE_PREFIX_PATH=${{ runner.temp }}/opt
          -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  read-with-puml:
    name: read-with-puml
    runs-on: ubuntu-24.04
    env:
      # a branch of PUML2 which reads meshes of several kinds of cells and walks down from them
      PUML_REF: davschneller/puml-rework3

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/checkout@v5
        with:
          repository: TUM-I5/PUML2
          ref: ${{ env.PUML_REF }}
          path: puml2
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qq ninja-build openmpi-bin libopenmpi-dev hdf5-tools \
            libhdf5-openmpi-dev libyaml-cpp-dev

      - name: Configure PUMGen
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPUML_DIR=${{ github.workspace }}/puml2
          -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build build

      # the conversions the reading needs run as well
      - name: Read the converted meshes with PUML
        run: ctest --test-dir build --output-on-failure -R "^puml[.]"

  pre-commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: pre-commit/action@v3.0.1
